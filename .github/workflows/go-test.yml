name: Go-test
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: mini_ecommerce_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d mini_ecommerce_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgres://app:app@localhost:5432/mini_ecommerce_test?sslmode=disable

    steps:
      - uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: go build -v ./...
      - name: Vet
        run: go vet ./...
      - name: Test with the Go CLI
        run: go test -p 1 ./... -count=1
